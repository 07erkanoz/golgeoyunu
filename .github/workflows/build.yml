name: Derleme (Android; istenirse Windows ve Linux)

# Her gönderimde yalnız Android derlenir (GitHub'ın ücretsiz Actions
# depolaması 0,5 GB; her derlemenin ara dosyaları onu dolduruyordu).
# Windows ve Linux elle: Actions → Derleme → Run workflow → masaustu: true.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      masaustu:
        description: Windows ve Linux da derlensin
        type: boolean
        default: false

permissions:
  contents: write

# Ardışık gönderimlerde eski çalışma iptal edilir: eski bir sürüm daha geç
# bitip "son sürüm" olarak yayımlanamaz.
concurrency:
  group: derleme-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  # Android çizicisi: impeller (kalıcı). Karşılaştırma gerekirse "skia";
  # APK aynı uygulama, kayıtlar korunur.
  GOLGE_RENDERER: impeller

jobs:
  windows:
    if: ${{ inputs.masaustu }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      - name: Windows için derle
        run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=CARTOON=true
      - name: Zip olarak paketle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath GolgeOyunu-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # Ara dosya: sürüm sayfasına konunca gereksiz; bir gün tutulur.
          retention-days: 1
          path: GolgeOyunu-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      # Test sürecinde yalnızca arm64 (bugünkü telefonların neredeyse hepsi);
      # mağaza için ileride tam paket (AAB) hazırlanacak.
      # Kalıcı imza: sürümler birbirinin üstüne kurulur, kayıtlar silinmez.
      # Gizli değişkenler yoksa debug anahtarıyla imzalanır.
      - name: İmza anahtarı
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/golge-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/golge-upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok; APK debug anahtarıyla imzalanıyor."
          fi
      - name: Android için derle (APK, arm64)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Sürüm kodu her derlemede artar: bazı üreticilerin yükleyicileri aynı
        # sürüm kodunun üstüne kurmayı reddedip kaldır-kur dayatıyordu (kayıt
        # ve ayarlar silinir).
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=CARTOON=true
      - name: İmza doğrulama (kalıcı anahtar)
        # Yalnızca kalıcı anahtarla imzalanmış APK yayımlanır: farklı imzalı
        # bir sürüm güncelleme olarak kurulamaz, kaldır-kur verileri siler.
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee imza.txt
          grep -q "SHA-256 digest: 04f4b8b4248a8c4a526c067f9bc947c3f1222a7aec00972197af6e028d66061f" imza.txt \
            || { echo "::error::APK kalıcı anahtarla imzalanmamış"; exit 1; }
      - name: Yeniden adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk GolgeOyunu-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          # Ara dosya: sürüm sayfasına konunca gereksiz; bir gün tutulur.
          retention-days: 1
          path: GolgeOyunu-android-arm64.apk

  linux:
    if: ${{ inputs.masaustu }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu paket sunucusu kimi zaman takılır: her deneme süreyle kesilir,
      # üç kez yeniden denenir; iş sonsuza dek beklemez.
      - name: Derleme bağımlılıkları
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 240 apt-get $APT update &&
              sudo timeout 420 apt-get $APT install -y clang cmake ninja-build pkg-config \
                libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev \
                libgstreamer-plugins-base1.0-dev && break
            echo "Paket indirme takıldı, yeniden deneniyor ($i/3)"
            sleep 15
          done
          dpkg -s libgtk-3-dev libgstreamer1.0-dev >/dev/null
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      # Testler ayrı işte (aşağıda) yanında koşar: derleme onları beklemez.
      - name: Linux için derle
        run: flutter build linux --release --build-number=${{ github.run_number }} --dart-define=CARTOON=true
      - name: tar.gz olarak paketle
        run: |
          mkdir -p GolgeOyunu
          cp -r build/linux/x64/release/bundle/* GolgeOyunu/
          tar -czf GolgeOyunu-linux-x64.tar.gz GolgeOyunu
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          # Ara dosya: sürüm sayfasına konunca gereksiz; bir gün tutulur.
          retention-days: 1
          path: GolgeOyunu-linux-x64.tar.gz

  # Testler derlemeyi beklemez, yanında üç parça hâlinde aynı anda koşar:
  # bütün testler ve bölüm denetimi; fizik 120 Hz; fizik 144 Hz. Biri
  # kırılırsa çalışma kırmızı görünür (sürüm yine yayımlanır: deneme
  # sürümleri).
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [tum, hz120, hz144]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      - name: Testler
        if: matrix.part == 'tum'
        run: flutter test
      - name: Bölüm denetimi (varılamayan yer, sıkışma, kapalı kapı)
        if: matrix.part == 'tum'
        run: python3 tools/audit.py
      - name: Fizik testleri (120 Hz)
        if: matrix.part == 'hz120'
        run: flutter test test/physics_test.dart --dart-define=HZ=120
      - name: Fizik testleri (144 Hz)
        if: matrix.part == 'hz144'
        run: flutter test test/physics_test.dart --dart-define=HZ=144

  # Sürüm Windows ve Android bitince yayımlanır; Linux paketi hazır olunca
  # aynı sürüme eklenir (Linux'un paket indirmesi takılırsa ötekiler beklemez).
  release:
    needs: [windows, android]
    # Windows derlenmediyse (atlandıysa) yalnız Android yayımlanır.
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Sürüm adı (tarih-saat, her zaman benzersiz)
        id: tag
        run: echo "name=build-$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: İndirme sayfasına yayımla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Gölge Oyunu · ${{ steps.tag.outputs.name }} · Android ${{ env.GOLGE_RENDERER }}
          prerelease: true
          files: |
            GolgeOyunu-windows.zip
            GolgeOyunu-android-arm64.apk
          body: |
            Otomatik derleme (commit ${{ github.sha }}).

            **Windows:** `GolgeOyunu-windows.zip` dosyasını bir klasöre çıkar, `golge.exe`'yi çalıştır.

            **Android:** `GolgeOyunu-android-arm64.apk` dosyasını telefona indir ve aç. "Bilinmeyen kaynaklardan yükleme" izni istenirse ver.

            Android çizicisi: **${{ env.GOLGE_RENDERER }}**.

            **Linux (Arch):** (paket, Linux derlemesi bitince birkaç dakika sonra eklenir)
            ```
            sudo pacman -S --needed gtk3 gstreamer gst-plugins-base gst-plugins-good gst-libav
            tar -xzf GolgeOyunu-linux-x64.tar.gz
            ./GolgeOyunu/kur.sh      # uygulama menüsüne Sâye ikonuyla ekler (bir kez)
            ./GolgeOyunu/golge
            ```

            Kontroller: ← → yürü, Boşluk zıpla, ↑ tırman/kol, ↓ çömel, Shift parmak ucu, F ateşböceği, Esc ayarlar.

  release-linux:
    needs: [release, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Linux paketini sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.release.outputs.tag }}"
          GolgeOyunu-linux-x64.tar.gz --clobber --repo "${{ github.repository }}"
