name: Derleme (Windows, Android, Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      - name: Windows için derle
        run: flutter build windows --release
      - name: Zip olarak paketle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath GolgeOyunu-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GolgeOyunu-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      # Test sürecinde yalnızca arm64 (bugünkü telefonların neredeyse hepsi);
      # mağaza için ileride tam paket (AAB) hazırlanacak.
      - name: Android için derle (APK, arm64)
        run: flutter build apk --release --target-platform android-arm64
      - name: Yeniden adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk GolgeOyunu-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: GolgeOyunu-android-arm64.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derleme bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Paketleri indir
        run: flutter pub get
      - name: Testler
        run: flutter test
      - name: Linux için derle
        run: flutter build linux --release
      - name: tar.gz olarak paketle
        run: |
          mkdir -p GolgeOyunu
          cp -r build/linux/x64/release/bundle/* GolgeOyunu/
          tar -czf GolgeOyunu-linux-x64.tar.gz GolgeOyunu
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: GolgeOyunu-linux-x64.tar.gz

  release:
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Sürüm adı (tarih-saat, her zaman benzersiz)
        id: tag
        run: echo "name=build-$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: İndirme sayfasına yayımla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Gölge Oyunu · ${{ steps.tag.outputs.name }}
          prerelease: true
          files: |
            GolgeOyunu-windows.zip
            GolgeOyunu-android-arm64.apk
            GolgeOyunu-linux-x64.tar.gz
          body: |
            Otomatik derleme (commit ${{ github.sha }}).

            **Windows:** `GolgeOyunu-windows.zip` dosyasını bir klasöre çıkar, `golge.exe`'yi çalıştır.

            **Android:** `GolgeOyunu-android-arm64.apk` dosyasını telefona indir ve aç. "Bilinmeyen kaynaklardan yükleme" izni istenirse ver.

            **Linux (Arch):**
            ```
            sudo pacman -S --needed gtk3 gstreamer gst-plugins-base gst-plugins-good gst-libav
            tar -xzf GolgeOyunu-linux-x64.tar.gz
            ./GolgeOyunu/golge
            ```

            Kontroller: ← → yürü, Boşluk zıpla, ↑ tırman/kol, ↓ çömel, Shift parmak ucu, F ateşböceği, Esc ayarlar.
