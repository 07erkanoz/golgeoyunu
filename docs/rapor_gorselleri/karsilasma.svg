<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Zekâ ve zamanlama isteyen karşılaşma</title><desc id="desc">Çanla bekçiyi yönlendirme, ışığı okuma, hareketli siper arkasında ilerleme ve güvenli duraklara aktarım.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#e9ad60"/></marker></defs><rect width="1500" height="850" fill="#211c28"/><g font-family="DejaVu Sans, sans-serif"><text x="50" y="60" font-size="30" fill="#f1e8d7" font-weight="700">ÖNCE PLANLA, SONRA DOĞRU ANDA GEÇ</text><text x="50" y="99" font-size="18" fill="#b9acbb" font-weight="400">Önerilen oda şeması • Ölçek ve süreler gerçek fizik ile doğrulanmalıdır.</text><rect x="45" y="135" width="1410" height="410" rx="18" fill="#342b3c"/><path d="M1110 230L760 475H1360Z" fill="#7fe6d2" opacity=".15"/><path d="M1110 230L900 475H1360" stroke="#7fe6d2" stroke-width="2" fill="none" stroke-dasharray="7 7"/><path d="M70 475H1425" stroke="#e9ad60" stroke-width="5"/><rect x="280" y="325" width="58" height="150" rx="7" fill="#17141d"/><rect x="940" y="345" width="58" height="130" rx="7" fill="#17141d"/><rect x="535" y="356" width="92" height="90" rx="12" fill="#766675" stroke="#b8a6b1" stroke-width="3"/><path d="M475 425H845" stroke="#b8a6b1" stroke-width="2" stroke-dasharray="8 7"/><path d="M580 333H800" stroke="#e9ad60" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(380 461) scale(0.85)" fill="#211b29"><ellipse cx="0" cy="-77" rx="19" ry="21"/><path d="M-18-86l-16-8 18-4 19-1 15 12zM-13-56Q9-64 17-45L22-13-17-13Z"/><path d="M-12-13l-8 25h13l12-23 11 23h14L15-15Z"/><path d="M-14-50l-25 17 4 8 30-16M11-48l21 24 6-5-17-25Z"/><path d="M-11-54l-31-5 8 10 24 4z"/><rect x="28" y="-30" width="18" height="25" rx="5" fill="#f1bf65" stroke="#211b29" stroke-width="3"/><circle cx="7" cy="-80" r="3" fill="#efd4a3"/></g><g transform="translate(1300 461) scale(1.1)" fill="#211b29"><ellipse cx="0" cy="-130" rx="20" ry="25"/><path d="M-20-143l18-28 21 30Z"/><path d="M10-140l28 15-29 4Z"/><path d="M-18-107Q10-119 25-94L31-5-32-5Z"/><path d="M-17-5l-5 18h18l5-18M12-5l7 18h19L29-5Z"/><path d="M20-98l33 30 7-8-30-35Z"/><path d="M-28-101l-17 40 9 5 23-45Z"/><path d="M55 5V-133q0-20 16-18" fill="none" stroke="#211b29" stroke-width="6"/><path d="M70-151v29" stroke="#211b29" stroke-width="3"/><rect x="59" y="-122" width="25" height="34" rx="7" fill="#7fe6d2" stroke="#211b29" stroke-width="4"/><circle cx="9" cy="-134" r="3" fill="#ecd9b7"/></g><g transform="translate(1088 230) scale(0.8)" stroke="#211b29" stroke-width="5"><path d="M-13 2h55l-7-12H-5z" fill="#211b29"/><path d="M10-10v-45q-10-10-5-30" fill="none"/><path d="M-15-78q0-28 29-28h27v54H14q-29 0-29-26" fill="#211b29"/><ellipse cx="42" cy="-79" rx="12" ry="27" fill="#7fe6d2"/><ellipse cx="44" cy="-79" rx="4" ry="15" fill="#211b29"/></g><path d="M155 260v35m-27 35q0-32 27-32t27 32z" fill="#e9ad60" stroke="#e9ad60" stroke-width="4"/><circle cx="155" cy="339" r="5" fill="#e9ad60"/><text x="98" y="380" font-size="17" fill="#efe3cc" font-weight="400">Çan / ses</text><text x="245" y="514" font-size="17" fill="#efe3cc" font-weight="400">A: sabit örtü</text><text x="535" y="514" font-size="17" fill="#efe3cc" font-weight="400">B: hareketli siper</text><text x="900" y="514" font-size="17" fill="#efe3cc" font-weight="400">C: güvenli durak</text><path d="M385 465Q460 420 555 461T960 461T1190 461" fill="none" stroke="#e9ad60" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="1120" y="291" font-size="16" fill="#efe3cc" font-weight="400">Gözcü: desen okunur</text><text x="1175" y="514" font-size="17" fill="#efe3cc" font-weight="400">Bekçi: sese yönelir</text><rect x="45" y="590" width="335" height="155" rx="14" fill="#f1e8d7"/><text x="63" y="629" font-size="17" fill="#302735" font-weight="700">1 · FIRSAT YARAT</text><text x="63" y="669" font-size="16" fill="#514551" font-weight="400">Çanı çal; bekçiyi</text><text x="63" y="695" font-size="16" fill="#514551" font-weight="400">yanlış yöne çek.</text><rect x="400" y="590" width="335" height="155" rx="14" fill="#f1e8d7"/><text x="418" y="629" font-size="17" fill="#302735" font-weight="700">2 · TARAMAYI OKU</text><text x="418" y="669" font-size="16" fill="#514551" font-weight="400">A örtüsünde</text><text x="418" y="695" font-size="16" fill="#514551" font-weight="400">ışığın dönüşünü izle.</text><rect x="755" y="590" width="335" height="155" rx="14" fill="#f1e8d7"/><text x="773" y="629" font-size="17" fill="#302735" font-weight="700">3 · RİTMİ TUT</text><text x="773" y="669" font-size="16" fill="#514551" font-weight="400">B taşıyla gölgede</text><text x="773" y="695" font-size="16" fill="#514551" font-weight="400">yürü; C’ye aktar.</text><rect x="1110" y="590" width="335" height="155" rx="14" fill="#f1e8d7"/><text x="1128" y="629" font-size="17" fill="#302735" font-weight="700">4 · İZ KAYBETTİR</text><text x="1128" y="669" font-size="16" fill="#514551" font-weight="400">Görüşü kes;</text><text x="1128" y="695" font-size="16" fill="#514551" font-weight="400">arama başlamadan çık.</text><text x="50" y="795" font-size="19" fill="#e9ad60" font-weight="400">Başarı: yalnız hızlı koşmak yetmez; oyuncu pencereyi kendisi hazırlar ve hareketini ona uydurur.</text></g></svg>